<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Recorrido 3D · Duna Azul</title>
  <style>
    :root { --noche: #070D17; --blanco-cal: #F5F2EB; --azul-piscina: #1E8FCB; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--noche); color: var(--blanco-cal);
      font-family: "DM Sans", system-ui, -apple-system, sans-serif; overflow: hidden;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      font-size: 15px; letter-spacing: .02em; pointer-events: none; transition: opacity .5s; }
    .status.hide { opacity: 0; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
      border: 2px solid rgba(245,242,235,.2); border-top-color: var(--blanco-cal); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint { position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px; background: rgba(7,13,23,.62);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
    .hint.hide { opacity: 0; }

    .joy { position: fixed; left: 20px; bottom: 20px; width: 112px; height: 112px; border-radius: 50%;
      background: rgba(7,13,23,.45); border: 1px solid rgba(245,242,235,.35);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); touch-action: none; }
    .joy-knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; background: rgba(245,242,235,.9); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
    .joy.hidden { display: none; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <canvas id="c" aria-label="Recorrido 3D del dormitorio"></canvas>
  <div class="status" id="status"><div><div class="spinner"></div><span id="statusText">Cargando…</span></div></div>
  <div class="hint hide" id="hint"></div>
  <div class="joy hidden" id="joy" aria-hidden="true"><div class="joy-knob" id="knob"></div></div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    // Recorrido en primera persona de un escaneo de Polycam (GLB).
    // Uso: walk.html?m=assets/3d/<nombre>.glb
    const EYE = 1.55;       // altura de los ojos sobre el piso (m)
    const MARGIN = 0.35;    // distancia mínima a las paredes (m)
    const SPEED = 1.3;      // m/s

    // Mismo idioma que eligió el visitante en la landing (mismo origen)
    let en = false;
    try { en = localStorage.getItem("duna-lang") === "en"; } catch (e) { /* sin almacenamiento */ }
    const touch = matchMedia("(pointer: coarse)").matches;
    const T = {
      load: en ? "Loading…" : "Cargando…",
      err: en ? "Couldn't load the 3D model." : "No se pudo cargar el modelo 3D.",
      hint: touch
        ? (en ? "Drag to look · joystick to move" : "Arrastra para mirar · joystick para moverte")
        : (en ? "Drag to look · WASD / arrows to move" : "Arrastra para mirar · WASD / flechas para moverte"),
    };
    const $ = (id) => document.getElementById(id);
    $("statusText").textContent = T.load;

    const src = new URLSearchParams(location.search).get("m") || "";
    if (!/^assets\/3d\/[\w-]+\.glb$/.test(src)) { $("statusText").textContent = T.err; throw new Error("modelo inválido"); }

    const canvas = $("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070d17);
    const camera = new THREE.PerspectiveCamera(touch ? 80 : 70, 1, 0.05, 50);
    camera.rotation.order = "YXZ";

    let yaw = 0, pitch = 0;
    const bounds = { minX: 0, maxX: 0, minZ: 0, maxZ: 0 };

    const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
    loader.load(src, (gltf) => {
      // Los escaneos traen la iluminación "horneada" en la textura: se muestran sin luces y por ambas caras.
      gltf.scene.traverse((o) => {
        if (!o.isMesh) return;
        const map = o.material.map;
        o.material.dispose();
        o.material = new THREE.MeshBasicMaterial({ map, side: THREE.DoubleSide });
      });
      scene.add(gltf.scene);

      const box = new THREE.Box3().setFromObject(gltf.scene);
      const c = box.getCenter(new THREE.Vector3());
      bounds.minX = Math.min(box.min.x + MARGIN, c.x); bounds.maxX = Math.max(box.max.x - MARGIN, c.x);
      bounds.minZ = Math.min(box.min.z + MARGIN, c.z); bounds.maxZ = Math.max(box.max.z - MARGIN, c.z);
      // Arranca junto a una pared (lado s: 0=+z, 1=+x, 2=-z, 3=-x) mirando al centro del ambiente
      const side = Math.abs(parseInt(new URLSearchParams(location.search).get("s") || "0", 10)) % 4;
      const sx = [c.x, bounds.maxX, c.x, bounds.minX][side];
      const sz = [bounds.maxZ, c.z, bounds.minZ, c.z][side];
      camera.position.set(sx, Math.min(box.min.y + EYE, box.max.y - 0.2), sz);
      yaw = Math.atan2(sx - c.x, sz - c.z);
      pitch = -0.12;

      $("status").classList.add("hide");
      const hint = $("hint");
      hint.textContent = T.hint;
      hint.classList.remove("hide");
      setTimeout(() => hint.classList.add("hide"), 4500);
      if (touch) $("joy").classList.remove("hidden");
    }, undefined, (e) => { console.error(e); $("statusText").textContent = T.err; });

    // ---- Mirar: arrastrar (un dedo / ratón) ----
    const looks = new Map();
    canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); looks.set(e.pointerId, [e.clientX, e.clientY]); });
    canvas.addEventListener("pointermove", (e) => {
      const p = looks.get(e.pointerId); if (!p) return;
      const k = 0.0042 * (70 / camera.fov);
      yaw += (e.clientX - p[0]) * k;
      pitch = THREE.MathUtils.clamp(pitch + (e.clientY - p[1]) * k, -1.3, 1.3);
      looks.set(e.pointerId, [e.clientX, e.clientY]);
    });
    const endLook = (e) => looks.delete(e.pointerId);
    canvas.addEventListener("pointerup", endLook);
    canvas.addEventListener("pointercancel", endLook);

    // ---- Moverse: teclado ----
    const keys = new Set();
    addEventListener("keydown", (e) => { keys.add(e.code); if (e.code.startsWith("Arrow")) e.preventDefault(); });
    addEventListener("keyup", (e) => keys.delete(e.code));
    addEventListener("blur", () => keys.clear());

    // ---- Moverse: joystick táctil ----
    const joy = $("joy"), knob = $("knob");
    const stick = { x: 0, y: 0, id: null };
    const moveStick = (e) => {
      const r = joy.getBoundingClientRect(), R = r.width / 2;
      let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
      const d = Math.hypot(dx, dy), max = R - 14;
      if (d > max) { dx *= max / d; dy *= max / d; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      stick.x = dx / max; stick.y = dy / max;
    };
    joy.addEventListener("pointerdown", (e) => { stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); moveStick(e); });
    joy.addEventListener("pointermove", (e) => { if (e.pointerId === stick.id) moveStick(e); });
    const endStick = (e) => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; knob.style.transform = ""; };
    joy.addEventListener("pointerup", endStick);
    joy.addEventListener("pointercancel", endStick);

    // ---- Bucle ----
    const clock = new THREE.Clock();
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize); resize();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      let f = -stick.y, s = stick.x;
      if (keys.has("KeyW") || keys.has("ArrowUp")) f += 1;
      if (keys.has("KeyS") || keys.has("ArrowDown")) f -= 1;
      if (keys.has("KeyD")) s += 1;
      if (keys.has("KeyA")) s -= 1;
      if (keys.has("ArrowLeft")) yaw += 1.6 * dt;
      if (keys.has("ArrowRight")) yaw -= 1.6 * dt;
      const len = Math.hypot(f, s);
      if (len > 1) { f /= len; s /= len; }
      if (len > 0.01) {
        const step = SPEED * dt;
        camera.position.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) * step;
        camera.position.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) * step;
        camera.position.x = THREE.MathUtils.clamp(camera.position.x, bounds.minX, bounds.maxX);
        camera.position.z = THREE.MathUtils.clamp(camera.position.z, bounds.minZ, bounds.maxZ);
      }
      camera.rotation.set(pitch, yaw, 0);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
